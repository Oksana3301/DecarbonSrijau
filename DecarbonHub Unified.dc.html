<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F3EFE3;color:#17241A;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
</style>
</helmet>

<!-- ACTIVE PRODUCT -->
<sc-if value="{{ isLanding }}" hint-placeholder-val="{{ true }}">
  <dc-import name="DecarbonHub Landing" hint-size="100%,100%"></dc-import>
</sc-if>
<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
  <dc-import name="DecarbonHub App" hint-size="100%,100%"></dc-import>
</sc-if>
<sc-if value="{{ isGov }}" hint-placeholder-val="{{ false }}">
  <dc-import name="DecarbonHub Dashboard Pemerintah" hint-size="100%,100%"></dc-import>
</sc-if>

<!-- FLOATING PRODUCT SWITCHER -->
<div style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:4px;background:#17241A;border:2px solid #17241A;border-radius:100px;padding:5px;box-shadow:0 10px 30px rgba(23,36,26,.28)">
  <div style="display:flex;align-items:center;gap:8px;padding:0 12px 0 8px">
    <img src="assets/decarbonhub-mark.png" alt="DecarbonHub" style="height:22px">
  </div>
  <button onClick="{{ goLanding }}" style="border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:100px;padding:9px 16px;background:{{ landingBg }};color:{{ landingFg }}">Landing</button>
  <button onClick="{{ goApp }}" style="border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:100px;padding:9px 16px;background:{{ appBg }};color:{{ appFg }}">Aplikasi</button>
  <button onClick="{{ goGov }}" style="border:none;cursor:pointer;font-weight:700;font-size:13px;border-radius:100px;padding:9px 16px;background:{{ govBg }};color:{{ govFg }}">Pemerintah &amp; Donor</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { view: 'landing' };
  go = (v) => this.setState({ view: v });
  renderVals() {
    const v = this.state.view;
    const on = '#F4C518', onFg = '#17241A', off = 'transparent', offFg = '#c3ccbd';
    return {
      isLanding: v === 'landing', isApp: v === 'app', isGov: v === 'gov',
      goLanding: () => this.go('landing'), goApp: () => this.go('app'), goGov: () => this.go('gov'),
      landingBg: v === 'landing' ? on : off, landingFg: v === 'landing' ? onFg : offFg,
      appBg: v === 'app' ? on : off, appFg: v === 'app' ? onFg : offFg,
      govBg: v === 'gov' ? on : off, govFg: v === 'gov' ? onFg : offFg,
    };
  }
}
</script>
</body>
</html>
